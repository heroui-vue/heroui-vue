packages:
  - packages/core
  - packages/heroui-vue
  - packages/icon
  - packages/shared
  - packages/components/*
  - packages/bin/*
  - playground
  - docs
  - __tests__

allowBuilds:
  "@heroui/shared-utils": false
  esbuild: false
  pnpm: true

verifyDepsBeforeRun: false

catalogs:
  prod:
    "@heroui/shared-utils": ^2.1.10
    "@heroui/system": ^2.4.20
    "@heroui/theme": ^2.4.26
    "@heroui/use-aria-button": ^2.2.18
    "@tailwindcss/vite": ^4.3.3
    "@types/node": ^22.15.26
    "@vitejs/plugin-vue": ^6.0.1
    "@vue/tsconfig": ^0.9.1
    "@vueuse/core": ^13.9.0
    tailwindcss: ^4.3.3
    unplugin-vue: ^8
    vite: ^8
    vue: ^3

patchedDependencies:
  "@vue/repl": patches/@vue__repl.patch
minimumReleaseAgeExclude:
  - vitepress-plugin-sfc@2.0.0-beta.4 || 2.0.0-beta.6
catalog:
  "@vueuse/core": ^15.0.0
